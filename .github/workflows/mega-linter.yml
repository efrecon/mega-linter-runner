---
name: MegaLinter

on:
  pull_request:
    branches:
      - main
      - master
      - feature/**/main
      - feature/**/master

env:
  APPLY_FIXES: none

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ghcr:
    runs-on: ubuntu-24.04
    # Allow mega-linter to write to the repository
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    name: GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: MegaLinter
        uses: ./
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE: SHELL,YAML,MARKDOWN
          DISABLE_LINTERS: BASH_SHFMT
        with:
          registry: ghcr.io
          flavor: documentation
  hub:
    runs-on: ubuntu-24.04
    # Allow mega-linter to write to the repository
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    name: Docker Hub
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: MegaLinter
        uses: ./
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE: SHELL,YAML,MARKDOWN
          DISABLE_LINTERS: BASH_SHFMT
        with:
          registry: docker.io
          flavor: documentation
